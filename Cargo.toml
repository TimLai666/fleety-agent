[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.21"
edition = "2021"
# 1.85 is the edition-2024 floor, required by the vendored `fleety-textarea`
# (see AGENTS.md, "Vendored Rust source"). CI builds on `stable`, so nothing
# verifies this number — treat it as a promise to source builders, and check it
# by hand when raising it.
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/TimLai666/fleety-agent"
publish = false

[workspace.dependencies]
# internal crates
agent-core = { path = "crates/agent-core" }
agent-workflow = { path = "crates/agent-workflow" }
fleety-protocol = { path = "crates/fleety-protocol" }
fleety-inline = { path = "crates/fleety-inline" }
fleety-markdown = { path = "crates/fleety-markdown" }
fleety-markdown-core = { path = "crates/fleety-markdown-core" }
fleety-textarea = { path = "crates/fleety-textarea" }
fleety-tools = { path = "crates/fleety-tools" }
fleety-vec = { path = "crates/fleety-vec" }
# external
machine-uid = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "net", "io-util", "io-std", "sync", "process"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart", "cookies"] }
futures = "0.3"
tokio-tungstenite = "0.24"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
base64 = "0.22"
arboard = "3"
png = "0.17"
cron = "0.15"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = { version = "0.10", default-features = false }
iana-time-zone = "0.1"
mdns-sd = "0.13"
zip = { version = "2", default-features = false, features = ["deflate"] }
fs4 = { version = "=1.1.0", default-features = false, features = ["sync"] }
# These exact pins were taken to hold Clap at the old Rust 1.80 baseline. That
# baseline is now 1.85, so the constraint no longer applies — the pins are kept
# only because nothing has re-tested a newer Clap. Safe to revisit.
clap = { version = "=4.5.4", default-features = false, features = ["derive", "std", "help", "usage", "error-context", "suggestions"] }
clap_complete = "=4.5.2"
