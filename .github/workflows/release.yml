name: release

# Cut a release by pushing a tag, e.g.:  git tag v0.1.0 && git push origin v0.1.0
# This builds the `fleety` CLI for each platform and attaches the archives to the
# GitHub Release, so the install one-liners (scripts/install.*) can fetch them
# from /releases/latest/download/.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          # No x86_64-apple-darwin: the ort/ONNX dependency ships no prebuilt
          # for Intel macOS (and macos-13, the last Intel image, is retired).
          # Intel Macs build fleety from source; their pure-Go sidecar still
          # ships from the sidecar-cross job below.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # fleety-server/fleetyd depend on fleety-tools (enigo + xcap + arboard),
      # which need X11/wayland/xkbcommon/xdo/dbus dev libs to build on Linux.
      - name: Install native build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-randr0-dev libxcb-shm0-dev \
            libwayland-dev libxkbcommon-dev libxdo-dev libdbus-1-dev pkg-config \
            libpipewire-0.3-dev clang libclang-dev \
            libegl1-mesa-dev libgbm-dev libgl1-mesa-dev libasound2-dev
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # Ship the latest Insyra at release time: bump the sidecar's Insyra
      # dependency AND all its sub-packages to latest, then refresh the vendored
      # skills from the SAME (release) Insyra version so the docs the agent reads
      # match the engine it drives. A breaking Insyra change surfaces here as a
      # build/test failure (fix the sidecar, don't pin around it). Must run before
      # the cargo build, which embeds the skills into fleety-server via include_str!.
      - name: Update Insyra + skills to latest release
        shell: bash
        env:
          # Anonymous api.github.com calls from shared runner IPs hit the
          # 60/hr rate limit (403) — authenticate with the workflow token.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd sidecars/fleety-insyra
          # Bump Insyra and every sidecar dependency to its latest version. CI
          # uses the latest stable Go (setup-go: stable), and `go mod tidy` raises
          # the go.mod `go` directive if a dependency needs a newer language version.
          go get -u github.com/HazelnutParadise/insyra@latest
          go get -u ./...
          go mod tidy
          go test ./...
          # tr -d '\r': on the Windows runner `go list` output carries a CR
          # that would silently corrupt the URLs built from $v (curl exit 3).
          v=$(go list -m -f '{{.Version}}' github.com/HazelnutParadise/insyra | tr -d '\r')
          echo "Insyra $v"
          # Mirror each vendored skill's WHOLE upstream directory (SKILL.md +
          # references/ + whatever else it ships — the file set isn't hardcoded)
          # from the resolved RELEASE tag ($v), never main, so the skills match the
          # embedded engine. Our Fleety-authored HEADER.md is preserved.
          bs="$GITHUB_WORKSPACE/crates/fleety-server/builtin-skills"
          api="https://api.github.com/repos/HazelnutParadise/insyra/git/trees/$v?recursive=1"
          raw="https://raw.githubusercontent.com/HazelnutParadise/insyra/$v"
          tree=$(curl -fsSL --retry 3 -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GITHUB_TOKEN" "$api")
          sync_skill() {  # <upstream-skill-dir> <local-dir>
            up="$1"; local="$2"
            find "$local" -mindepth 1 -not -name HEADER.md -delete 2>/dev/null || true
            mkdir -p "$local"
            # tr -d '\r': jq.exe emits CRLF on the Windows runner — a CR left
            # on each path corrupts the raw URLs (curl exit 3).
            echo "$tree" | jq -r --arg p "skills/$up/" \
              '.tree[] | select(.type=="blob" and (.path|startswith($p))) | .path' \
              | tr -d '\r' \
              | while read -r path; do
                  rel="${path#skills/$up/}"
                  mkdir -p "$local/$(dirname "$rel")"
                  curl -fsSL --retry 3 "$raw/$path" -o "$local/$rel"
                done
          }
          sync_skill use-insyra-cli "$bs/fleety-use-insyra-dsl"
          sync_skill insyra "$bs/insyra"
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --bin fleety --bin fleety-server --bin fleetyd
      # GOARCH follows the Rust target (x64 macOS cross-builds on the arm64
      # runner). Pure Go — CGO pinned off so a future cgo dependency fails
      # loudly here instead of silently changing linkage (same posture as the
      # sidecar-cross job). Ship the sidecar as a RAW per-target binary (not
      # archived) so installers and `fleetyd update` just download + chmod —
      # no tar/zip extraction. `-s -w` drops DWARF + symbol table (~30%
      # smaller); Go panic tracebacks are unaffected.
      - name: Build insyra sidecar
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          raw="$GITHUB_WORKSPACE/fleety-insyra-${{ matrix.target }}"
          [ "${{ matrix.archive }}" = "zip" ] && raw="$raw.exe"
          case "${{ matrix.target }}" in
            x86_64-*) goarch=amd64 ;;
            aarch64-*) goarch=arm64 ;;
            *) echo "unmapped GOARCH for ${{ matrix.target }}" >&2; exit 1 ;;
          esac
          (cd sidecars/fleety-insyra && GOARCH="$goarch" go build -trimpath -ldflags "-s -w" -o "$raw" .)
      # Raw per-binary executables ship alongside the archives so the updater
      # (fleetyd update / fleety update / server-version convergence) can
      # download + swap without extraction — same posture as the fleety-insyra
      # sidecar. Staged into raw/ and also uploaded as workflow artifacts for
      # the manifests fan-in job, which hashes every target's exact bytes.
      - name: Stage raw binaries
        shell: bash
        run: |
          ext=""
          [ "${{ matrix.archive }}" = "zip" ] && ext=".exe"
          mkdir -p raw
          for b in fleety fleety-server fleetyd; do
            cp "target/${{ matrix.target }}/release/$b$ext" "raw/$b-${{ matrix.target }}$ext"
          done
      - name: Upload raw binaries for the manifests job
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ matrix.target }}
          path: raw/
      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          for b in fleety fleety-server fleetyd; do
            tar -czf "$GITHUB_WORKSPACE/$b-${{ matrix.target }}.tar.gz" "$b"
          done
      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          foreach ($b in 'fleety', 'fleety-server', 'fleetyd') {
            Compress-Archive -Path "target/${{ matrix.target }}/release/$b.exe" -DestinationPath "$b-${{ matrix.target }}.zip"
          }
      # Only attach on a real tag push; `workflow_dispatch` is a build-only
      # dry-run that verifies every target compiles + packages before cutting a tag.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            fleety-${{ matrix.target }}.${{ matrix.archive }}
            fleety-server-${{ matrix.target }}.${{ matrix.archive }}
            fleetyd-${{ matrix.target }}.${{ matrix.archive }}
            fleety-insyra-${{ matrix.target }}
            fleety-insyra-${{ matrix.target }}.exe
            raw/fleety-${{ matrix.target }}
            raw/fleety-${{ matrix.target }}.exe
            raw/fleety-server-${{ matrix.target }}
            raw/fleety-server-${{ matrix.target }}.exe
            raw/fleetyd-${{ matrix.target }}
            raw/fleetyd-${{ matrix.target }}.exe

  # Fan-in: one update manifest per binary, covering every target's raw asset
  # (multi-target schema: version + targets{triple: {url, sha256}} + a
  # versioned_manifest URL template). Updaters resolve these via
  #   FLEETY_UPDATE_MANIFEST=https://github.com/<repo>/releases/latest/download/{bin}-manifest.json
  # Manifest urls pin the tag (releases/download/<tag>/…): those assets are
  # immutable, so a manifest's sha256 stays valid after newer releases ship.
  manifests:
    name: build update manifests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: raw-*
          path: raw
          merge-multiple: true
      - name: Generate and validate manifests
        shell: bash
        run: |
          set -euo pipefail
          # The manifest version MUST equal the binaries' compiled-in workspace
          # version (agent_core::VERSION): needs_update() is a plain
          # version-difference test, so a mismatched manifest would make every
          # freshly-updated binary look outdated again — an install loop.
          # Section-aware scan: only the version line inside [workspace.package]
          # (a bare grep could match a version line in some other section).
          ws=$(awk -F'"' '/^\[workspace\.package\]/{s=1;next} /^\[/{s=0} s && /^version = /{print $2; exit}' Cargo.toml)
          [ -n "$ws" ] || { echo "cannot read [workspace.package] version from Cargo.toml" >&2; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
            if [ "${tag#v}" != "$ws" ]; then
              echo "tag $tag does not match workspace version $ws — fix the tag or Cargo.toml and re-run" >&2
              exit 1
            fi
          else
            tag="v$ws"  # workflow_dispatch dry-run: stand-in tag, nothing attaches
          fi
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download"
          targets="x86_64-unknown-linux-gnu aarch64-apple-darwin x86_64-pc-windows-msvc"
          expected=$(wc -w <<<"$targets")
          mkdir -p manifests
          for bin in fleety fleety-server fleetyd; do
            json='{}'
            for t in $targets; do
              f="raw/$bin-$t"
              [ -f "$f" ] || f="raw/$bin-$t.exe"
              [ -f "$f" ] || { echo "missing raw binary for $bin ($t)" >&2; exit 1; }
              sha=$(sha256sum "$f" | cut -d' ' -f1)
              json=$(jq --arg t "$t" --arg url "$base/$tag/$(basename "$f")" --arg sha "$sha" \
                '.targets[$t] = {url: $url, sha256: $sha}' <<<"$json")
            done
            jq --arg v "${tag#v}" --arg vm "$base/v{version}/$bin-manifest.json" \
              '{version: $v, versioned_manifest: $vm} + .' <<<"$json" > "manifests/$bin-manifest.json"
            # Field-completeness gate: version, versioned_manifest, and a full
            # url+sha256 (lowercase hex) entry for every target.
            jq -e --arg v "${tag#v}" --argjson n "$expected" '
              .version == $v
              and (.versioned_manifest | type == "string")
              and ((.targets | length) == $n)
              and ([.targets[] | (.url | type == "string") and (.sha256 | test("^[0-9a-f]{64}$"))] | all)
            ' "manifests/$bin-manifest.json" >/dev/null \
              || { echo "generated $bin-manifest.json failed validation" >&2; exit 1; }
          done
          ls -l manifests
      # Always uploaded as a workflow artifact so a workflow_dispatch dry-run
      # can be inspected without attaching anything to a release.
      - name: Upload manifests as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: update-manifests
          path: manifests/
      # Re-runs are safe: action-gh-release's overwrite_files defaults to true,
      # so a fixed re-run of this job REPLACES same-named assets (verified
      # against the action's docs) — no delete-then-upload dance needed.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: manifests/*.json

  # The Go sidecar also ships for platforms that have no Rust release target:
  # ARM/RISC-V Linux SBCs (Pi, LicheeRV, NAS…) and Intel macOS (ort ships no
  # prebuilt there). A source-built fleety/fleetyd on those hosts still
  # downloads its sidecar from the release page (the shared target table in
  # fleety-tools deps maps arch/os to these triples — keep both lists in
  # sync). Pure-Go cross builds; CGO is pinned off so a future cgo dependency
  # fails loudly here instead of silently changing linkage. No 32-bit ARM:
  # Insyra's thrift dependency doesn't build where Go's `int` is 32-bit.
  sidecar-cross:
    name: build sidecar (linux arm64/riscv64, darwin x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # Same "ship the latest Insyra" posture as the main jobs. The vendored
      # skills mirroring isn't repeated here — this job runs no cargo build, so
      # nothing embeds them.
      - name: Update Insyra to latest release
        run: |
          cd sidecars/fleety-insyra
          go get -u github.com/HazelnutParadise/insyra@latest
          go get -u ./...
          go mod tidy
          go test ./...
      - name: Cross-build insyra sidecar
        env:
          CGO_ENABLED: "0"
        run: |
          cd sidecars/fleety-insyra
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o "$GITHUB_WORKSPACE/fleety-insyra-aarch64-unknown-linux-gnu" .
          GOOS=linux GOARCH=riscv64 go build -trimpath -ldflags "-s -w" -o "$GITHUB_WORKSPACE/fleety-insyra-riscv64gc-unknown-linux-gnu" .
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o "$GITHUB_WORKSPACE/fleety-insyra-x86_64-apple-darwin" .
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            fleety-insyra-aarch64-unknown-linux-gnu
            fleety-insyra-riscv64gc-unknown-linux-gnu
            fleety-insyra-x86_64-apple-darwin
