name: release

# Cut a release by pushing a tag, e.g.:  git tag v0.1.0 && git push origin v0.1.0
# This builds the `fleety` CLI for each platform and attaches the archives to the
# GitHub Release, so the install one-liners (scripts/install.*) can fetch them
# from /releases/latest/download/.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # fleety-server/fleetyd depend on fleety-tools (enigo + xcap + arboard),
      # which need X11/wayland/xkbcommon/xdo/dbus dev libs to build on Linux.
      - name: Install native build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-randr0-dev libxcb-shm0-dev \
            libwayland-dev libxkbcommon-dev libxdo-dev libdbus-1-dev pkg-config \
            libpipewire-0.3-dev clang libclang-dev \
            libegl1-mesa-dev libgbm-dev libgl1-mesa-dev libasound2-dev
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # Ship the latest Insyra at release time: bump the sidecar's Insyra
      # dependency AND all its sub-packages to latest, then refresh the vendored
      # skills from the SAME (release) Insyra version so the docs the agent reads
      # match the engine it drives. A breaking Insyra change surfaces here as a
      # build/test failure (fix the sidecar, don't pin around it). Must run before
      # the cargo build, which embeds the skills into fleety-server via include_str!.
      - name: Update Insyra + skills to latest release
        shell: bash
        run: |
          cd sidecars/fleety-insyra
          # Bump Insyra and every sidecar dependency to its latest version. CI
          # uses the latest stable Go (setup-go: stable), and `go mod tidy` raises
          # the go.mod `go` directive if a dependency needs a newer language version.
          go get -u github.com/HazelnutParadise/insyra@latest
          go get -u ./...
          go mod tidy
          go test ./...
          v=$(go list -m -f '{{.Version}}' github.com/HazelnutParadise/insyra)
          echo "Insyra $v"
          # Mirror each vendored skill's WHOLE upstream directory (SKILL.md +
          # references/ + whatever else it ships — the file set isn't hardcoded)
          # from the resolved RELEASE tag ($v), never main, so the skills match the
          # embedded engine. Our Fleety-authored HEADER.md is preserved.
          bs="$GITHUB_WORKSPACE/crates/fleety-server/builtin-skills"
          api="https://api.github.com/repos/HazelnutParadise/insyra/git/trees/$v?recursive=1"
          raw="https://raw.githubusercontent.com/HazelnutParadise/insyra/$v"
          tree=$(curl -fsSL -H "Accept: application/vnd.github+json" "$api")
          sync_skill() {  # <upstream-skill-dir> <local-dir>
            up="$1"; local="$2"
            find "$local" -mindepth 1 -not -name HEADER.md -delete 2>/dev/null || true
            mkdir -p "$local"
            echo "$tree" | jq -r --arg p "skills/$up/" \
              '.tree[] | select(.type=="blob" and (.path|startswith($p))) | .path' \
              | while read -r path; do
                  rel="${path#skills/$up/}"
                  mkdir -p "$local/$(dirname "$rel")"
                  curl -fsSL "$raw/$path" -o "$local/$rel"
                done
          }
          sync_skill use-insyra-cli "$bs/fleety-use-insyra-dsl"
          sync_skill insyra "$bs/insyra"
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --bin fleety --bin fleety-server --bin fleetyd
      # Each runner's arch matches its target, so a native `go build` is correct.
      # Ship the sidecar as a RAW per-target binary (not archived) so installers
      # and `fleetyd update` just download + chmod — no tar/zip extraction.
      # `-s -w` drops DWARF + symbol table (~30% smaller); Go panic tracebacks
      # are unaffected.
      - name: Build insyra sidecar
        shell: bash
        run: |
          raw="$GITHUB_WORKSPACE/fleety-insyra-${{ matrix.target }}"
          [ "${{ matrix.archive }}" = "zip" ] && raw="$raw.exe"
          (cd sidecars/fleety-insyra && go build -trimpath -ldflags "-s -w" -o "$raw" .)
      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          for b in fleety fleety-server fleetyd; do
            tar -czf "$GITHUB_WORKSPACE/$b-${{ matrix.target }}.tar.gz" "$b"
          done
      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          foreach ($b in 'fleety', 'fleety-server', 'fleetyd') {
            Compress-Archive -Path "target/${{ matrix.target }}/release/$b.exe" -DestinationPath "$b-${{ matrix.target }}.zip"
          }
      # Only attach on a real tag push; `workflow_dispatch` is a build-only
      # dry-run that verifies every target compiles + packages before cutting a tag.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            fleety-${{ matrix.target }}.${{ matrix.archive }}
            fleety-server-${{ matrix.target }}.${{ matrix.archive }}
            fleetyd-${{ matrix.target }}.${{ matrix.archive }}
            fleety-insyra-${{ matrix.target }}
            fleety-insyra-${{ matrix.target }}.exe

  # The Go sidecar also ships for ARM/RISC-V Linux SBCs (Pi, LicheeRV, NAS…)
  # that have no Rust release target yet: a source-built fleetyd there still
  # downloads its sidecar from the release page (deps::insyra maps arch/os to
  # these triples — keep both lists in sync). Pure-Go cross builds; CGO is
  # pinned off so a future cgo dependency fails loudly here instead of silently
  # changing linkage. No 32-bit ARM: Insyra's thrift dependency doesn't build
  # where Go's `int` is 32-bit.
  sidecar-cross:
    name: build sidecar (linux arm64/riscv64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # Same "ship the latest Insyra" posture as the main jobs. The vendored
      # skills mirroring isn't repeated here — this job runs no cargo build, so
      # nothing embeds them.
      - name: Update Insyra to latest release
        run: |
          cd sidecars/fleety-insyra
          go get -u github.com/HazelnutParadise/insyra@latest
          go get -u ./...
          go mod tidy
          go test ./...
      - name: Cross-build insyra sidecar
        env:
          CGO_ENABLED: "0"
          GOOS: linux
        run: |
          cd sidecars/fleety-insyra
          GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o "$GITHUB_WORKSPACE/fleety-insyra-aarch64-unknown-linux-gnu" .
          GOARCH=riscv64 go build -trimpath -ldflags "-s -w" -o "$GITHUB_WORKSPACE/fleety-insyra-riscv64gc-unknown-linux-gnu" .
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            fleety-insyra-aarch64-unknown-linux-gnu
            fleety-insyra-riscv64gc-unknown-linux-gnu
