name: release

# Cut a release by pushing a tag, e.g.:  git tag v0.1.0 && git push origin v0.1.0
# This builds the `fleety` CLI for each platform and attaches the archives to the
# GitHub Release, so the install one-liners (scripts/install.*) can fetch them
# from /releases/latest/download/.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build fleety
        run: cargo build --release --locked --target ${{ matrix.target }} --bin fleety
      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: tar -C target/${{ matrix.target }}/release -czf fleety-${{ matrix.target }}.tar.gz fleety
      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/fleety.exe -DestinationPath fleety-${{ matrix.target }}.zip
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: fleety-${{ matrix.target }}.${{ matrix.archive }}
