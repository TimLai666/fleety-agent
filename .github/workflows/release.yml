name: release

# Cut a release by pushing a tag, e.g.:  git tag v0.1.0 && git push origin v0.1.0
# This builds the `fleety` CLI for each platform and attaches the archives to the
# GitHub Release, so the install one-liners (scripts/install.*) can fetch them
# from /releases/latest/download/.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # Ship the latest Insyra at release time: bump the sidecar's dependency,
      # then refresh the vendored use-insyra-cli skill to the SAME version so the
      # DSL reference the agent reads matches the engine it drives. A breaking
      # Insyra change surfaces here as a build/test failure (fix the sidecar,
      # don't pin around it). Must run before the cargo build, which embeds the
      # skill into fleety-server via include_str!.
      - name: Update Insyra + skill to latest
        shell: bash
        run: |
          cd sidecars/fleety-insyra
          go get -u github.com/HazelnutParadise/insyra@latest
          go mod tidy
          go test ./...
          v=$(go list -m -f '{{.Version}}' github.com/HazelnutParadise/insyra)
          echo "Insyra $v"
          skill="$GITHUB_WORKSPACE/crates/fleety-server/builtin-skills/use-insyra-cli/SKILL.upstream.md"
          base="https://raw.githubusercontent.com/HazelnutParadise/insyra"
          curl -fsSL "$base/$v/skills/use-insyra-cli/SKILL.md" -o "$skill" \
            || curl -fsSL "$base/main/skills/use-insyra-cli/SKILL.md" -o "$skill"
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --bin fleety --bin fleety-server --bin fleetyd
      # Each runner's arch matches its target, so a native `go build` is correct.
      - name: Build insyra sidecar
        shell: bash
        run: |
          out="$GITHUB_WORKSPACE/target/${{ matrix.target }}/release/fleety-insyra"
          [ "${{ matrix.archive }}" = "zip" ] && out="$out.exe"
          (cd sidecars/fleety-insyra && go build -trimpath -o "$out" .)
      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          for b in fleety fleety-server fleetyd fleety-insyra; do
            tar -czf "$GITHUB_WORKSPACE/$b-${{ matrix.target }}.tar.gz" "$b"
          done
      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          foreach ($b in 'fleety', 'fleety-server', 'fleetyd', 'fleety-insyra') {
            Compress-Archive -Path "target/${{ matrix.target }}/release/$b.exe" -DestinationPath "$b-${{ matrix.target }}.zip"
          }
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            fleety-${{ matrix.target }}.${{ matrix.archive }}
            fleety-server-${{ matrix.target }}.${{ matrix.archive }}
            fleetyd-${{ matrix.target }}.${{ matrix.archive }}
            fleety-insyra-${{ matrix.target }}.${{ matrix.archive }}
