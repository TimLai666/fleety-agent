[package]
name = "fleety-server"
description = "Fleety Agent server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "fleety-server"
path = "src/main.rs"

[dependencies]
agent-core = { workspace = true }
agent-workflow = { workspace = true }
fleety-protocol = { workspace = true }
fleety-tools = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures = { workspace = true }
# HTTP front (WebSocket upgrade + SSE/POST fallback) on the one listen port.
axum = { version = "0.8", features = ["ws"] }
serde_json = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
cron = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
iana-time-zone = { workspace = true }
mdns-sd = { workspace = true }
if-addrs = { workspace = true }
flume = "0.11"
sha2 = "0.10"
# Parse the originating device's Codex `~/.codex/config.toml` (codex_sources).
toml = "0.8"
# Embed whole built-in skill directories (SKILL.md + references/…) into the
# binary without hardcoding their file list — the set of files in a skill can
# change upstream; only SKILL.md is guaranteed.
include_dir = "0.7"
# Unzip the synced-skills repo archive (skill_sync).
zip = { workspace = true }
base64 = { workspace = true }
# On-disk sqlite-vec vector store (vectors live in a SQLite DB file, queried
# via SQL — no in-RAM index) for wiki semantic search. The one unsafe
# sqlite-vec registration is isolated in the `fleety-vec` crate so this crate
# stays `forbid(unsafe_code)`.
rusqlite = { version = "0.32", features = ["bundled"] }
fleety-vec = { workspace = true }
clap = { workspace = true }

# Local embedding model (EmbeddingGemma via ONNX). Not on Intel macOS: the
# ort/ONNX runtime ships no prebuilt x86_64-apple-darwin library, so semantic
# embedding is compiled out there and src/embed.rs swaps in a stub whose
# `enabled()` is always false (every caller then takes its embedding-off path).
[target.'cfg(not(all(target_os = "macos", target_arch = "x86_64")))'.dependencies]
fastembed = "5"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"

[dev-dependencies]
filetime = "0.2"
serial_test = "3"
