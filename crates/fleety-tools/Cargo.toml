[package]
name = "fleety-tools"
description = "Shared workspace tools (read/list/search/write/edit/run/git/diff), root-relative so they run on the server's workspace or any device via fleetyd."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
agent-core = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
grep = "0.3"
ignore = "0.4"
similar = "2"
toml = "0.8"
# Browser (CDP) tools + Chrome auto-provisioning, shared so they run on the
# server and on any device via fleetyd.
tokio = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }
tokio-tungstenite = { workspace = true }
tracing = { workspace = true }
zip = { workspace = true }
# Native computer-use (desktop control) so it runs on any device via fleetyd.
enigo = "0.6"
xcap = "0.9"
png = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
serial_test = "3"
