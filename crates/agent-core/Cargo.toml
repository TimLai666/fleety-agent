[package]
name = "agent-core"
description = "Generic agent core: errors, never-crash primitives, observability. The future standalone framework; depends on no Fleety crate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde = { workspace = true }
serde_json.workspace = true
async-trait.workspace = true
reqwest = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
base64 = { workspace = true }
uuid = { workspace = true }
# AST-aware code compression (CodeCompressor): fold function bodies, keep
# structure. tree-sitter grammars are vendored C, compiled at build time.
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.23"
