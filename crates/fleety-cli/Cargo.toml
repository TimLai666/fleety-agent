[package]
name = "fleety-cli"
description = "fleety — the Fleety CLI / TUI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "fleety"
path = "src/main.rs"

[dependencies]
agent-core = { workspace = true }
fleety-protocol = { workspace = true }
# anstyle: the vendored markdown renderer types its palette in anstyle, so the
# chat theme in markdown.rs has to speak it too.
anstyle = "1.0"
fleety-inline = { workspace = true }
fleety-markdown = { workspace = true }
fleety-textarea = { workspace = true }
fleety-tools = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
# unstable-rendered-line-info: Paragraph::line_count, used to bottom-anchor the
# TUI conversation. unstable-widget-ref: render_stateful_widget_ref, used to
# draw the `fleety-textarea` composer from a shared &App. (The version stays
# pinned to 0.29 so the unstable APIs can't drift under us — and it is the same
# 0.29 the vendored composer was written against.)
ratatui = { version = "0.29", features = [
    "unstable-rendered-line-info",
    "unstable-widget-ref",
] }
base64 = { workspace = true }
arboard = { workspace = true }
png = { workspace = true }
mdns-sd = { workspace = true }
cpal = "0.15"
uuid = { workspace = true }
# The FLEETY_TZ picker offers the IANA zone list (TZ_VARIANTS) to search.
chrono-tz = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
unicode-segmentation = "=1.13.3"

[dev-dependencies]
uuid = { workspace = true }
